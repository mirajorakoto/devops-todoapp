version: '3.8'

services:

  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: todoapp-db
    restart: always
    environment:
      POSTGRES_DB: todoapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mirajo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - todoapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Spring Boot
  app:
    build: .
    container_name: todoapp-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/todoapp_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mirajo
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todoapp-network

networks:
  todoapp-network:
    driver: bridge

volumes:
  postgres_data:
