name: CI/CD Pipeline — TodoApp DevOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: mirajorakoto/todoapp

jobs:

  # ===== JOB 1 : BUILD & TEST =====
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build avec Maven
        run: mvn clean compile -q

      - name: Lancer les tests
        run: mvn test -q

      - name: Package JAR
        run: mvn package -DskipTests -q

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ===== JOB 2 : DOCKER BUILD & PUSH =====
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Image publiée avec succès
        run: |
          echo "✅ Image disponible sur Docker Hub :"
          echo "   docker pull ${{ env.IMAGE_NAME }}:latest"

  # ===== JOB 3 : NOTIFICATION =====
  notify:
    name: Résumé Pipeline
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-push]
    if: always()

    steps:
      - name: Résumé du pipeline
        run: |
          echo "=================================="
          echo "  PIPELINE TODOAPP DEVOPS"
          echo "=================================="
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Auteur  : ${{ github.actor }}"
          echo "  Status  : ${{ needs.build-and-test.result }}"
          echo "  Docker  : ${{ needs.docker-build-push.result }}"
          echo "=================================="
